<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #fff;
            border-radius: 16px;
            padding: 40px;
            max-width: 640px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #1a1a1a;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: border-color 0.2s;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #667eea;
        }
        button {
            padding: 14px 24px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        button:hover:not(:disabled) { background: #5568d3; }
        button:disabled { background: #b0b0b0; cursor: not-allowed; }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            border-bottom: 2px solid #f0f0f0;
        }
        .tab {
            padding: 10px 16px;
            background: none;
            color: #666;
            border: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .status {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }
        .status.info { background: #e3f2fd; color: #1565c0; display: block; }
        .status.error { background: #ffebee; color: #c62828; display: block; }
        .status.success { background: #e8f5e9; color: #2e7d32; display: block; }

        .result {
            display: none;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 12px;
            border: 1px solid #e0e5ff;
        }
        .result.show { display: block; }
        .result h3 {
            font-size: 15px;
            margin-bottom: 12px;
            color: #1a1a1a;
        }
        .download-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: #2e7d32;
            color: #fff;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            margin-top: 12px;
            transition: background 0.2s;
        }
        .download-btn:hover { background: #1b5e20; }

        .meta {
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }
        .meta strong { color: #1a1a1a; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Video Downloader</h1>
        <p class="subtitle">YouTube, TikTok, Twitter, Instagram и другие</p>

        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="Вставьте ссылку на видео...">
            <button id="fetchBtn">Скачать</button>
        </div>

        <div class="tabs">
            <button class="tab active" data-type="video">Видео</button>
            <button class="tab" data-type="audio">Только аудио</button>
        </div>

        <div class="status" id="status"></div>

        <div class="result" id="result">
            <h3 id="resultTitle">Файл готов</h3>
            <div class="meta" id="resultMeta"></div>
            <a id="downloadLink" class="download-btn" href="#" target="_blank">⬇ Скачать файл</a>
        </div>
    </div>

    <script>
        const API_URL = 'https://api.cobalt.tools/api/json';
        let currentType = 'video';

        const urlInput = document.getElementById('videoUrl');
        const fetchBtn = document.getElementById('fetchBtn');
        const statusEl = document.getElementById('status');
        const resultEl = document.getElementById('result');
        const resultTitle = document.getElementById('resultTitle');
        const resultMeta = document.getElementById('resultMeta');
        const downloadLink = document.getElementById('downloadLink');

        // Переключение между "видео" и "аудио"
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentType = tab.dataset.type;
            });
        });

        function showStatus(message, type = 'info') {
            statusEl.textContent = message;
            statusEl.className = 'status ' + type;
        }

        function hideStatus() {
            statusEl.className = 'status';
            statusEl.textContent = '';
        }

        function resetResult() {
            resultEl.classList.remove('show');
            downloadLink.href = '#';
        }

        async function fetchVideo() {
            const url = urlInput.value.trim();

            if (!url) {
                showStatus('Введите ссылку на видео', 'error');
                return;
            }

            // Простая проверка на URL
            if (!/^https?:\/\//i.test(url)) {
                showStatus('Ссылка должна начинаться с http:// или https://', 'error');
                return;
            }

            hideStatus();
            resetResult();
            fetchBtn.disabled = true;
            fetchBtn.textContent = 'Обработка...';
            showStatus('Получаем информацию о видео...', 'info');

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        url: url,
                        isAudioOnly: currentType === 'audio',
                        vQuality: '720' // 144, 240, 360, 480, 720, 1080, max
                    })
                });

                if (!response.ok) {
                    throw new Error(`API вернул ошибку ${response.status}`);
                }

                const data = await response.json();

                // Cobalt может вернуть status: 'stream', 'redirect', 'picker', 'error'
                if (data.status === 'error') {
                    throw new Error(data.text || data.error?.code || 'Не удалось обработать видео');
                }

                let downloadUrl;

                if (data.status === 'stream' || data.status === 'redirect') {
                    downloadUrl = data.url;
                } else if (data.status === 'picker' && data.picker?.length) {
                    // Если несколько файлов — берём первый
                    downloadUrl = data.picker[0].url;
                } else if (data.url) {
                    downloadUrl = data.url;
                } else {
                    throw new Error('API не вернул ссылку на файл');
                }

                // Показываем результат
                downloadLink.href = downloadUrl;
                downloadLink.setAttribute('download', '');
                resultTitle.textContent = currentType === 'audio'
                    ? '🎵 Аудио готово'
                    : '🎬 Видео готово';
                resultMeta.innerHTML = `
                    <strong>Тип:</strong> ${currentType === 'audio' ? 'Аудио (mp3)' : 'Видео (mp4)'}<br>
                    <strong>Ссылка:</strong> ${url.length > 60 ? url.slice(0, 60) + '...' : url}
                `;
                resultEl.classList.add('show');
                showStatus('✅ Файл готов к скачиванию', 'success');

            } catch (error) {
                console.error(error);
                showStatus('Ошибка: ' + error.message, 'error');
            } finally {
                fetchBtn.disabled = false;
                fetchBtn.textContent = 'Скачать';
            }
        }

        fetchBtn.addEventListener('click', fetchVideo);
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') fetchVideo();
        });
    </script>
</body>
</html>
